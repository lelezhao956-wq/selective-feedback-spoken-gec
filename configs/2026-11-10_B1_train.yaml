run: 2026-11-10_B1_train
stage: B1
mode: asr   # asr = official Whisper-small transcript; fluent = manual fluent STM, DD skipped
dataset: train
corpus_root: $CORPUS_DIR
flist: reference-materials/flists.flac/train-gec.tsv
input: reference-materials/pre-norm/train-gec.ctm
task_input: baseline-pipeline/run-scripts/run-asr-to-task-input.sh --task gec (official, unmodified)
dd: sandi-models/dd/dd_model via run-gec.sh (env sandi-dd, x86_64 under Rosetta 2)
gec: sandi-models/gec/gec_model with gec-plus-align.py (batch_size 32, num_beams 5, max_new_tokens 128, max_length 128), CPU
scoring:
  wer: scoring-tools/run-scripts/run-wer-scoring.sh --stm reference-materials/stms/train-gec.stm
  sgecf: scoring-tools/run-scripts/run-sgecf-scoring.sh --edit_detail --flt_stm reference-materials/stms/train-fluent.stm --gec_stm reference-materials/stms/train-gec.stm
seed: none (no random process; beam search and all scripts are deterministic)
corpus_out_dir: stageB/B1_train
command: cd $CORPUS_DIR && caffeinate -i bash $SCRIPTS_DIR/b_pipeline2.sh asr train reference-materials/flists.flac/train-gec.tsv stageB/B1_train > stageB/B1_train.log 2>&1
collect: bash $SCRIPTS_DIR/b_collect.sh asr 2026-11-10_B1_train stageB/B1_train stageB/B1_train.log
note: run with b_pipeline2.sh (v2 = v1 + verbatim mode; asr/fluent branches identical). B1 dev used b_pipeline.sh (v1) because it was already running.
