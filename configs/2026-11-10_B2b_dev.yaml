run: 2026-11-10_B2b_dev
stage: B2b
mode: verbatim   # manual verbatim transcript (stms/dev-asr.stm) + real DD + GEC
dataset: dev
corpus_root: $CORPUS_DIR
flist: reference-materials/flists.flac/dev-gec.tsv
input: reference-materials/stms/dev-asr.stm -> 04_scripts/stm_to_ctm.py --phrase_unit segment --drop_in_ignore_of reference-materials/stms/dev-fluent.stm
task_input: baseline-pipeline/run-scripts/run-asr-to-task-input.sh --task gec (official, unmodified)
dd: sandi-models/dd/dd_model via run-gec.sh (env sandi-dd, x86_64 under Rosetta 2)
gec: sandi-models/gec/gec_model with gec-plus-align.py (batch_size 32, num_beams 5, max_new_tokens 128, max_length 128), CPU
scoring:
  wer: scoring-tools/run-scripts/run-wer-scoring.sh --stm reference-materials/stms/dev-gec.stm
  sgecf: scoring-tools/run-scripts/run-sgecf-scoring.sh --edit_detail --flt_stm reference-materials/stms/dev-fluent.stm --gec_stm reference-materials/stms/dev-gec.stm
seed: none (no random process)
corpus_out_dir: stageB/B2b_dev
command: cd $CORPUS_DIR && caffeinate -i bash $SCRIPTS_DIR/b_pipeline2.sh verbatim dev reference-materials/flists.flac/dev-gec.tsv stageB/B2b_dev > stageB/B2b_dev.log 2>&1
collect: bash $SCRIPTS_DIR/b_collect.sh verbatim 2026-11-10_B2b_dev stageB/B2b_dev stageB/B2b_dev.log
