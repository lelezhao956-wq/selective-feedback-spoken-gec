  outputs: "06_results/GRECO_<system>_eval.json (file names carry GRECO; replaces G_<system>_eval.json; no G_* file was ever written)"
  added_reporting: "operating points cov05/ffr30 (rule of c6b_addendum.thresholds on each model's OOF scores) with grouped-bootstrap CIs;
                    AUROC per FP cause (asr/dd/gec, primary v4 + literal); GRECO scoring time per edit/utterance/pair"
  scoring_detail: "the official GRECO.score() passes no attention mask, so batch padding would change scores; pairs are batched only with
                   pairs of identical token length (no padding, equal to one-by-one scoring); model.device set to the run device
                   (official score() hard-codes cpu/cuda); models.py unchanged. Verified on the dev-subset before the full run
                   (bucketed vs batch-1, MPS vs CPU) and on the authors' public CoNLL-2014 example (re-rank vs released outputs)."
  order: "per system: score train/dev/eval, then fit + eval once (B1, W, Q)"
