per_edit_mapping (04_scripts/g_greco_score.py):
  inputs: "official ERRANT input lines per utterance: S = system fluent source (flt_ctm.txt), G = GEC hypothesis (gec_ctm.txt); hypothesis
           edits from labels v4 (o_start/o_end in S, c_start/c_end in G) = exactly the edits being labelled and ranked"
  scores: "q = GRECO.score(src, hyp). greco_single = q(S, S+e) - q(S, S) (edit applied alone); greco_loo = q(S, G) - q(S, G-e) (edit reverted
           inside the full hypothesis); greco_sent = q(S, G)"
  text: "lower-case spoken transcripts without punctuation, as produced by the pipeline (no re-casing or punctuation restoration)"
models (04_scripts/g_greco_model.py, eswa-c):
  greco_zs: "GRECO-only zero-shot ranking: risk = -greco_single (no fitting)"
  greco_lr: "GRECO-only LR on [greco_single, greco_loo, greco_sent] (c_model.lr_pipe, C in {0.01,0.1,1,10}, inner GroupKFold 3)"
  risk_greco: "LightGBM on the frozen final.yaml feature set + the 3 GRECO scores; c_model LGB grid; nested grouped CV as C2 (same outer folds);
               final fit tuned by inner CV on all train+dev; never tuned on eval"
  risk_lgbm: "the system's existing final model (frozen artifacts), reference"
prespecified_comparisons: [risk_lgbm vs greco_lr, risk_greco vs greco_lr]   # primary GRECO-only = greco_lr; greco_zs reported alongside
secondary: [risk_lgbm vs greco_zs, risk_greco vs risk_lgbm]
systems: [B1, W]     # eval of each scored once (06_results/G_<system>_eval.json must not exist before)
endpoints: "as C7 (AURC and P@0.5 primary; FFR/precision at coverage 0.3/0.5/0.7/0.9; F0.5@0.5, maxF0.5, AUROC, AUPRC); 1000 submission-grouped
            bootstrap, seed 20261110, paired two-sided percentile p"
validation_before_full_run: "dev-subset (21 files): all edits scored, finite scores, token counts of S equal n_src_tokens of every edit,
                             speed in s/edit -> full-run estimate; failure -> GRECO abandoned with the reason recorded"
execution: "04_scripts/e_after_q.sh (nohup caffeinate -ims, nice 10) after the Q queue; GRECO steps run only if the env, the clone and the
            checkpoint (sha256 above) are present, otherwise SKIPPED with the reason; resumable (scored rows kept)"
