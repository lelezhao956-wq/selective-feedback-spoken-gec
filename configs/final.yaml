# Plan: 03_configs/2026-11-10_C_plan.yaml (pre-registered); deviations listed under 'deviations_from_plan'.
system_under_test: B1 = official S&I 2025 baseline (Whisper-small pre-norm CTM -> official DD -> official BART GEC), unchanged
labels:
  target: false_feedback (official SGECF matching, b3_edit_labels.py v3 logic)
  attribution: labels v4 = v3 definitions with the markup-free manual verbatim reference V (stm_to_ctm.py --drop_markup)
  primary_asr_err: excludes ASR omissions of disfluencies (literal = sensitivity)
eval_procedure_C7:
  1: b_pipeline2.sh asr eval reference-materials/flists.flac/eval-gec.tsv stageB/B1_eval  (official pipeline; scoring with eval STMs)
  2: b_norm_verbatim.sh eval reference-materials/flists.flac/eval-gec.tsv stageB/norm_verbatim_v4_eval --drop_markup
  3: b3_edit_labels.py --run_dir stageB/B1_eval --ds eval --mode asr --verbatim_norm_ctm stageB/norm_verbatim_v4_eval/gec/norm/gec.ctm
  4: c1_bart_score.py --run_dir stageB/B1_eval ; c1_features.py --ds eval (same verification checks, exit 3 on failure)
  5: score eval edits with the frozen artifacts below (no refitting, no tuning); compute the endpoints once
features: ["asr_conf_o_min", "asr_conf_o_mean", "asr_conf_win_min", "asr_conf_win_mean", "asr_conf_ctx2_min", "asr_dur_win_min", "asr_dur_o_mean", "utt_asr_conf_mean", "utt_asr_conf_min", "utt_asr_lowconf_frac", "utt_rate_wps", "dd_del_inside", "dd_del_adjacent", "dd_del_conf_min", "utt_dd_del_rate", "gec_copy_lp_o_mean", "gec_copy_lp_o_min", "gec_copy_lp_win_min", "gec_lp_c_mean", "gec_lp_c_min", "gec_ent_c_mean", "gec_agree_c_all", "gec_lp_next", "gec_ent_next", "gec_lp_ratio", "phrase_lp_per_word", "phrase_copy_gap_per_word", "op", "type_pos", "part", "o_len", "c_len", "n_src_tokens", "rel_pos", "n_edits_utt", "phrase_len_words", "edit_at_phrase_edge", "utt_words"]
