  kind: lightgbm
  params: {"learning_rate": 0.05, "subsample": 0.8, "subsample_freq": 1, "colsample_bytree": 0.8, "random_state": 20261110, "deterministic": true, "force_row_wise": true, "num_leaves": 7, "n_estimators": 100, "min_child_samples": 20}
  categorical_levels: {"op": ["M", "R", "U"], "type_pos": ["ADJ", "ADJ:FORM", "ADV", "CONJ", "CONTR", "DET", "MORPH", "NOUN", "NOUN:INFL", "NOUN:NUM", "NOUN:POSS", "ORTH", "OTHER", "PART", "PREP", "PRON", "PUNCT", "SPELL", "VERB", "VERB:FORM", "VERB:INFL", "VERB:SVA", "VERB:TENSE", "WO"], "part": ["P1", "P3", "P4", "P5"]}
  artifact: 05_runs/2026-11-10_C6_final/risk_lgbm.txt
  inner_cv_auroc_on_train_dev: "[corpus-derived value omitted; see the paper]"
baselines:
  asr_conf: {risk: 1 - min Whisper confidence over edit window +-1 token, missing -> 0.74 (train+dev median)}
  asr_lr: {params: {"C": 10}, artifact: 05_runs/2026-11-10_C6_final/asr_lr.pkl}
  gec_lr: {params: {"C": 1}, artifact: 05_runs/2026-11-10_C6_final/gec_lr.pkl}
  type_prior: 05_runs/2026-11-10_C6_final/type_prior.json
  random: {seed: 20261110}
endpoints:
  primary: [AURC, precision at coverage 0.5]                    # as pre-registered
  main_reported: [precision and false-feedback rate (1 - precision) at coverage 0.3/0.5/0.7/0.9, AURC]
  secondary: [F0.5 at coverage 0.5, max F0.5, AUROC, AUPRC]
  comparisons: [risk_lgbm vs asr_conf (planned), risk_lgbm vs gec_lr (unplanned, added 2026-11-10), risk_lgbm vs asr_lr (unplanned)]
  inference: 1000 submission-grouped bootstrap resamples of eval, seed 20261110, paired two-sided percentile p
operating_thresholds_from_train_dev_oof: "[corpus-derived value omitted; see the paper]"   # reported only; endpoints are coverage-based
deviations_from_plan:
  - comparisons vs gec_lr and asr_lr added after the plan (user request); marked unplanned everywhere
  - false-feedback rate (= 1 - precision) reported as a main metric next to precision; F0.5 secondary (already secondary in the plan)
  - labels v4 (markup-free reference V) used for cause attribution; target false_feedback unaffected
  - unplanned analyses: AUROC per FP cause; paired bootstrap of feature-group ablations
